name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, mnm]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Put local tools on PATH
        run: echo "/Users/mattp/local/bin" >> "$GITHUB_PATH"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Package site
        run: |
          rm -f "$RUNNER_TEMP/artifact.tar"
          tar --exclude='./.git' --exclude='./.github' -cf "$RUNNER_TEMP/artifact.tar" .
          test -f index.html || { echo "::error::index.html missing"; exit 1; }
          SIZE=$(wc -c < "$RUNNER_TEMP/artifact.tar")
          echo "artifact.tar is $SIZE bytes"
          [ "$SIZE" -gt 1000000 ] || { echo "::error::artifact suspiciously small"; exit 1; }

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
