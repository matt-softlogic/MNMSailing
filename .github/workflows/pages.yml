name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, mnm]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Put local tools on PATH
        run: echo "/Users/mattp/local/bin" >> "$GITHUB_PATH"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Stage site
        run: |
          rm -rf "$RUNNER_TEMP/_site" && mkdir -p "$RUNNER_TEMP/_site"
          rsync -a --exclude='.git' --exclude='.github' ./ "$RUNNER_TEMP/_site/"
          test -f "$RUNNER_TEMP/_site/index.html" || { echo "::error::index.html missing from staged site"; exit 1; }
          echo "Staged $(find "$RUNNER_TEMP/_site" -type f | wc -l) files"

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
